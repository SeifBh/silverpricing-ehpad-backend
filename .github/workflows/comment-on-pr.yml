name: Comment on File Diff in Pull Request

on:
  pull_request:
    types:
      - opened

jobs:
  comment-on-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Add a comment to a file diff in the PR
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr_number = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const comment = "This is a test comment on the file diff!";
            
            // Define the file path and the line you want to comment on
            const filePath = 'src/main/java/fr/silverpricing/api/config/deserializer/ChambreDeserializer.java';
            const lineNumber = 42; // Line number of the diff you want to comment on
            
            // Get the list of changed files in the pull request
            const filesResponse = await github.rest.pulls.listFiles({
              owner,
              repo,
              pull_number: pr_number
            });
            
            const file = filesResponse.data.find(file => file.filename === filePath);
            const linePosition = lineNumber; // You can map this to diff_hunk or position if needed
            
            if (file) {
              // Add a review comment to the file diff
              await github.rest.pulls.createReviewComment({
                owner,
                repo,
                pull_number: pr_number,
                body: comment,
                commit_id: context.payload.pull_request.head.sha,
                path: filePath,
                side: 'RIGHT', // Commenting on the right side of the diff
                line: linePosition
              });
            } else {
              console.log('File not found in the PR diff');
            }
