name: Review PR Diff

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  reviewmycode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v2

      - name: Fetch Base and Head Branches
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}
          git fetch origin ${{ github.event.pull_request.head.ref }}:refs/remotes/origin/${{ github.event.pull_request.head.ref }}

      - name: Check Branches and HEAD
        run: |
          git branch -a
          git log --oneline -5

      - name: Get PR Diff
        id: diff
        run: |
          echo "Getting PR diff between base and head"
          diff=$(git diff refs/remotes/origin/${{ github.event.pull_request.base.ref }}...refs/remotes/origin/${{ github.event.pull_request.head.ref }})
          echo "::set-output name=diff::$diff"

      - name: Print PR Diff for Debugging
        run: echo "${{ steps.diff.outputs.diff }}"
