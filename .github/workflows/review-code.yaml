name: Review PR Diff

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  reviewmycode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v2

      - name: Fetch All History for Diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} ${{ github.event.pull_request.head.ref }} --depth=1

      - name: Check Branches and HEAD
        run: |
          git branch -a
          git log --oneline -5

      - name: Get PR Diff
        id: diff
        run: |
          echo "Getting PR diff between base and head"
          diff=$(git diff ${{ github.event.pull_request.base.ref }}...${{ github.event.pull_request.head.ref }})
          echo "::set-output name=diff::$diff"

      - name: Print PR Diff for Debugging
        run: echo "${{ steps.diff.outputs.diff }}"
